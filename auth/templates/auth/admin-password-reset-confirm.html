{% extends 'auth/base.html' %}

{% block title %}Confirm Reset Code{% endblock %}

{% block content %}
<main class="screen">
    <section class="auth-card" aria-label="Confirm reset code">
        <h1 class="auth-card__title">Confirm Code</h1>

        <form class="auth-form" method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <p class="auth-form__error">{{ form.non_field_errors.0 }}</p>
            {% endif %}
            <label class="auth-form__field">
                <span class="auth-form__label">Confirmation code</span>
                <input class="auth-form__input" type="text" name="code" value="{{ form.code.value|default:'' }}" required>
            </label>

            <label class="auth-form__field">
                <span class="auth-form__label">New password</span>
                <input class="auth-form__input" type="password" name="password" required>
            </label>

            <label class="auth-form__field">
                <span class="auth-form__label">Repeat password</span>
                <input class="auth-form__input" type="password" name="password_repeat" required>
            </label>

            <button class="auth-form__submit" type="submit">Update password</button>
        </form>

        <a class="auth-card__register" href="{% url 'auth:admin_password_reset_start' %}">Request a new code</a>
    </section>
</main>
{% endblock %}
