{% extends 'auth/base.html' %}
{% load static %}

{% block title %}New Password{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'auth/css/admin-login.css' %}">
{% endblock %}

{% block content %}
<main class="admin-auth-screen">
    <section class="admin-auth-card" aria-label="New password">
        <div class="admin-auth-card__illustration" aria-hidden="true">
            <img src="{% static 'auth/img/admin-login-illustration.svg' %}" alt="">
        </div>

        <div class="admin-auth-form-wrap">
            <h1 class="admin-auth-title admin-auth-title--smaller">Set New Password</h1>

            <form class="admin-auth-form" method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <p class="admin-auth-form__error">{{ form.non_field_errors.0 }}</p>
                {% endif %}
                <label class="admin-auth-form__field">
                    <span class="admin-auth-form__label">New password</span>
                    <span class="admin-auth-form__input-wrap">
                        <input class="admin-auth-form__input" type="password" name="password" placeholder="Enter new password" required>
                    </span>
                </label>

                <label class="admin-auth-form__field">
                    <span class="admin-auth-form__label">Repeat password</span>
                    <span class="admin-auth-form__input-wrap">
                        <input class="admin-auth-form__input" type="password" name="password_repeat" placeholder="Repeat password" required>
                    </span>
                </label>

                <button class="admin-auth-form__submit admin-auth-form__submit--tight" type="submit">Save</button>
            </form>
        </div>
    </section>
</main>
{% endblock %}
