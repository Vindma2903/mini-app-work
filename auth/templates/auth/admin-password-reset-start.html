{% extends 'auth/base.html' %}

{% block title %}Admin Password Reset{% endblock %}

{% block content %}
<main class="screen">
    <section class="auth-card" aria-label="Admin password reset">
        <h1 class="auth-card__title">Reset Admin Password</h1>

        <form class="auth-form" method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <p class="auth-form__error">{{ form.non_field_errors.0 }}</p>
            {% endif %}
            <label class="auth-form__field">
                <span class="auth-form__label">Phone number</span>
                <input class="auth-form__input" type="tel" name="phone" value="{{ form.phone.value|default:'' }}" required>
            </label>

            <button class="auth-form__submit" type="submit">Send code</button>
        </form>

        <a class="auth-card__register" href="{% url 'auth:admin_login' %}">Back to admin login</a>
    </section>
</main>
{% endblock %}
