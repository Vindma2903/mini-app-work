{% load static %}
<div class="training-rate-modal" id="training-rate-modal" hidden>
    <div class="training-rate-modal__overlay"></div>
    <section class="training-rate-modal__card" role="dialog" aria-modal="true" aria-labelledby="training-rate-title">
        <button type="button" class="training-rate-modal__close" aria-label="Закрыть">
            <img src="{% static 'auth/img/result-saved-close.svg' %}" alt="">
        </button>

        <h2 class="training-rate-modal__title" id="training-rate-title">Оценить тренировку</h2>

        <div class="training-rate-modal__ratings">
            <div class="training-rate-modal__row">
                <span>Общая</span>
                <div class="training-rate-modal__stars" aria-label="Оценка общая">
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                </div>
            </div>
            <div class="training-rate-modal__row">
                <span>Силовая</span>
                <div class="training-rate-modal__stars" aria-label="Оценка силовая">
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                </div>
            </div>
            <div class="training-rate-modal__row">
                <span>Кардио</span>
                <div class="training-rate-modal__stars" aria-label="Оценка кардио">
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                </div>
            </div>
            <div class="training-rate-modal__row">
                <span>Метабол.</span>
                <div class="training-rate-modal__stars" aria-label="Оценка метаболическая">
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star training-rate-modal__star--active">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                    <button type="button" class="training-rate-modal__star">★</button>
                </div>
            </div>
        </div>

        <label class="training-rate-modal__comment">
            <span>Комментарий</span>
            <textarea placeholder="|"></textarea>
        </label>

        <button type="button" class="training-rate-modal__save">Cохранить</button>
    </section>
</div>
