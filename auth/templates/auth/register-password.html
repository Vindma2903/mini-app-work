{% extends 'auth/base.html' %}
{% load static %}

{% block title %}Регистрация - Установка пароля{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'auth/css/register-password.css' %}">
{% endblock %}

{% block content %}
<main class="register-password-screen">
    <a class="register-password-back" href="{% url 'auth:register' %}">
        <img class="register-password-back__icon" src="{% static 'auth/img/register-back-arrow.svg' %}" alt="" aria-hidden="true">
        <span class="register-password-back__text">Назад</span>
    </a>

    <section class="register-password-card" aria-label="Установка пароля">
        <h1 class="register-password-card__title">Установите пароль</h1>

        <form class="register-password-form" method="post" action="{% url 'auth:register_password' %}">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <p class="register-password-form__error">{{ form.non_field_errors.0 }}</p>
            {% endif %}
            <label class="register-password-form__field">
                <span class="register-password-form__label">Введите пароль</span>
                <input class="register-password-form__input" type="password" name="password" required>
            </label>

            <label class="register-password-form__field">
                <span class="register-password-form__label">Повторите пароль</span>
                <input class="register-password-form__input" type="password" name="password_repeat" required>
            </label>

            <button class="register-password-form__submit" type="submit">Сохранить</button>
        </form>
    </section>
</main>
{% endblock %}
