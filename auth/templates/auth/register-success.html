{% extends 'auth/base.html' %}
{% load static %}

{% block title %}Успех регистрации{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'auth/css/register-success.css' %}">
{% endblock %}

{% block content %}
<main class="register-success-screen">
    <section class="register-success-card" aria-label="Успех регистрации">
        <div class="register-success-card__icon" aria-hidden="true">✓</div>
        <h1 class="register-success-card__title">Почта для подтверждения отправлена</h1>
        <p class="register-success-card__text">Перейдите по ссылке из письма, после этого можно выполнить вход.</p>
        <a class="register-success-card__button" href="{% url 'auth:login' %}">Перейти ко входу</a>
    </section>
</main>
{% endblock %}
