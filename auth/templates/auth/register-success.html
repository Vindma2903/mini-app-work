{% extends 'auth/base.html' %}
{% load static %}

{% block title %}Успех регистрации{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'auth/css/register-success.css' %}">
{% endblock %}

{% block content %}
<main class="register-success-screen">
    <section class="register-success-card" aria-label="Успех регистрации">
        <h1 class="register-success-card__title">Успешно!</h1>
        <p class="register-success-card__text">Вы успешно зарегистрировались на платформе CrossFitness</p>
        <a class="register-success-card__button" href="{% url 'auth:login' %}">Войти</a>
    </section>
</main>
{% endblock %}
