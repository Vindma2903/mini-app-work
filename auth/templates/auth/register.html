{% extends 'auth/base.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'auth/css/register.css' %}">
{% endblock %}

{% block content %}
<main class="register-screen">
    <a class="register-back" href="{% url 'auth:login' %}">
        <img class="register-back__icon" src="{% static 'auth/img/register-back-arrow.svg' %}" alt="" aria-hidden="true">
        <span class="register-back__text">Назад</span>
    </a>

    <section class="register-card" aria-label="Регистрация">
        <h1 class="register-card__title">Регистрация</h1>

        <form class="register-form" method="post" action="{% url 'auth:register' %}">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <p class="register-form__error">{{ form.non_field_errors.0 }}</p>
            {% endif %}
            <label class="register-form__field">
                <span class="register-form__label">Имя</span>
                <input class="register-form__input" type="text" name="first_name" value="{{ form.first_name.value|default:'' }}" required>
            </label>

            <label class="register-form__field">
                <span class="register-form__label">Фамилия</span>
                <input class="register-form__input" type="text" name="last_name" value="{{ form.last_name.value|default:'' }}" required>
            </label>

            <label class="register-form__field">
                <span class="register-form__label">Дата рождения</span>
                <input class="register-form__input" type="date" name="birth_date" value="{{ form.birth_date.value|default:'' }}" required>
            </label>

            <label class="register-form__field">
                <span class="register-form__label">Почта</span>
                <input class="register-form__input" type="email" name="email" value="{{ form.email.value|default:'' }}" required>
            </label>

            <label class="register-form__field">
                <span class="register-form__label">Номер телефона</span>
                <input class="register-form__input" type="tel" name="phone" value="{{ form.phone.value|default:'' }}" required>
            </label>

            <label class="register-form__field">
                <span class="register-form__label">Ключ доступа (8 цифр)</span>
                <input class="register-form__input" type="text" name="access_key" value="{{ form.access_key.value|default:'' }}" inputmode="numeric" pattern="\d{8}" maxlength="8" autocomplete="off" required>
            </label>

            <button class="register-form__submit" type="submit">Далее</button>
        </form>
    </section>
</main>
{% endblock %}
