services:
  postgres:
    image: postgres:16-alpine
    container_name: mini_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_app_db}
      POSTGRES_USER: ${POSTGRES_USER:-mini_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_app_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_app_user} -d ${POSTGRES_DB:-mini_app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_app_web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

volumes:
  postgres_data:
  static_files:
  media_files:
